    <style>
      :root {
        --bg: #f4f3f0;
        --ink: #151515;
        --muted: #6c6a64;
        --line: rgb(21 21 21 / 0.12);
        --accent: #2c55c9;
        --sans: Inter, ui-sans-serif, system-ui, sans-serif;
        --mono: 'JetBrains Mono', ui-monospace, monospace;
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--sans); }
      a { color: inherit; text-decoration-color: color-mix(in srgb, var(--ink) 30%, transparent); text-underline-offset: 3px; }
      a:hover { color: var(--accent); text-decoration-color: currentColor; }
      .w-wrap { max-width: 760px; margin: 0 auto; padding: 40px 20px 72px; }
      .w-head h1 { margin: 18px 0 4px; font-size: clamp(34px, 7vw, 48px); line-height: 1.05; letter-spacing: -0.02em; font-weight: 600; }
      .w-role, .w-meta, .w-back, .w-nav, .w-contact, .w-more summary, .w-foot { font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em; }
      .w-role { margin: 0 0 18px; color: var(--accent); text-transform: uppercase; }
      .w-head > p:not([class]) { margin: 0 0 12px; max-width: 64ch; }
      .w-personal { margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--line); max-width: 64ch; color: color-mix(in srgb, var(--ink) 78%, var(--bg)); }
      .w-back { margin: 0; }
      .w-back a, .w-foot a { text-decoration: none; }
      .w-contact { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 18px 0; }
      .w-nav { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 -20px; padding: 12px 20px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); text-transform: uppercase; }
      .w-nav a { text-decoration: none; color: var(--muted); }
      .w-nav a:hover { color: var(--accent); }
      .w-section { padding-top: 28px; scroll-margin-top: 48px; }
      .w-section h2 { margin: 0 0 6px; padding-bottom: 8px; border-bottom: 1px solid var(--ink); font: 500 12px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; }
      .w-item { padding: 16px 0; border-bottom: 1px solid var(--line); scroll-margin-top: 48px; }
      .w-item h3 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; }
      .w-item h3 a { text-decoration: none; }
      .w-meta { margin: 3px 0 8px; color: var(--muted); }
      .w-item > p:not([class]) { margin: 0 0 8px; }
      .w-item ul { margin: 0 0 8px; padding-left: 18px; color: color-mix(in srgb, var(--ink) 82%, var(--bg)); }
      .w-item li { margin: 2px 0; }
      .w-links { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0; font: 13px var(--mono); }
      .w-more { padding: 12px 0; }
      .w-more summary { cursor: pointer; color: var(--muted); }
      .w-more summary:hover { color: var(--accent); }
      .w-films { list-style: none; margin: 0; padding: 0; }
      .w-films li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
      .w-films .w-meta { margin: 0; }
      .w-foot { margin-top: 40px; }
      @media print {
        .w-nav, .w-back, .w-foot { display: none; }
        body { background: #fff; }
        .w-more { display: block; }
      }
    </style>
  </head>
  <body>
    <div class="w-wrap"><!--work-list--></div>
  </body>
